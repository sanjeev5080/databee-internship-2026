# This is a Databricks asset bundle definition for my_first_job.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_first_job
  uuid: 5c012089-b368-4745-b9d6-e1b7342bcd83

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-a6d413ca-868d.cloud.databricks.com
    variables:
      catalog: generated_from_dab
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-a6d413ca-868d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/suhashraja1906@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/suhashraja1906@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: generated_from_dab
      schema: prod
    permissions:
      - user_name: suhashraja1906@gmail.com
        level: CAN_MANAGE
